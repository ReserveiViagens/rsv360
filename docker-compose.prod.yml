# RSV360 — Docker Compose produção
# Uso: cp .env.production.example .env && docker compose -f docker-compose.prod.yml up -d --build
# Imagens GHCR (CD): defina RSV360_*_IMAGE ou deixe build local via docker/frontend/Dockerfile

x-prod-env: &prod-env
  NODE_ENV: production
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
  NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
  INTERNAL_API_URL: http://backend:3002

networks:
  rsv360_prod:
    name: rsv360_prod
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360-prod}-postgres
    restart: always
    networks: [rsv360_prod]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - rsv360_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360-prod}-redis
    restart: always
    networks: [rsv360_prod]
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - rsv360_prod_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ${RSV360_BACKEND_IMAGE:-ghcr.io/reserveiviagens/rsv360/backend:latest}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360-prod}-backend
    restart: always
    networks: [rsv360_prod]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3002:3002'
    environment:
      PORT: 3002
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      FORNECEDORES_ENCRYPTION_KEY: ${FORNECEDORES_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      OAUTH_BFF_SECRET: ${OAUTH_BFF_SECRET}
      OAUTH_DEV_MOCK: ${OAUTH_DEV_MOCK:-false}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL}
      PASSWORD_RESET_EMAIL_FROM: ${PASSWORD_RESET_EMAIL_FROM}
      PASSWORD_RESET_EMAIL_WEBHOOK: ${PASSWORD_RESET_EMAIL_WEBHOOK:-}
      PASSWORD_RESET_EMAIL_WEBHOOK_SECRET: ${PASSWORD_RESET_EMAIL_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3002/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  site-publico:
    image: ${RSV360_SITE_PUBLICO_IMAGE:-ghcr.io/reserveiviagens/rsv360/site-publico:latest}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP_DIR: apps/site-publico
        APP_PORT: 3000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        INTERNAL_API_URL: http://backend:3002
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360-prod}-site-publico
    restart: always
    networks: [rsv360_prod]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      <<: *prod-env
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      BACKEND_INTERNAL_URL: http://backend:3002
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}

  turismo:
    image: ${RSV360_TURISMO_IMAGE:-ghcr.io/reserveiviagens/rsv360/turismo:latest}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP_DIR: apps/turismo
        APP_PORT: 3005
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        INTERNAL_API_URL: http://backend:3002
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360-prod}-turismo
    restart: always
    networks: [rsv360_prod]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3005:3005'
    environment:
      <<: *prod-env
      PORT: 3005
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3002}

  admin:
    image: ${RSV360_ADMIN_IMAGE:-ghcr.io/reserveiviagens/rsv360/admin:latest}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP_DIR: apps/admin
        APP_PORT: 3004
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        INTERNAL_API_URL: http://backend:3002
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360-prod}-admin
    restart: always
    networks: [rsv360_prod]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3004:3004'
    environment:
      <<: *prod-env
      PORT: 3004

  guest:
    image: ${RSV360_GUEST_IMAGE:-ghcr.io/reserveiviagens/rsv360/guest:latest}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP_DIR: apps/guest
        APP_PORT: 3006
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        INTERNAL_API_URL: http://backend:3002
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360-prod}-guest
    restart: always
    networks: [rsv360_prod]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3006:3006'
    environment:
      <<: *prod-env
      PORT: 3006

volumes:
  rsv360_prod_pgdata:
  rsv360_prod_redis:
