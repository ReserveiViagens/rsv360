// @ts-nocheck
name: CI Pipeline
on:
  push:
    branches: [main, ''stabilization/**'']
  pull_request:
    branches: [main]

concurrency:
  group: `${{ github.workflow }}-${{ github.ref }}`
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: rsv360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ''18''
          cache: ''npm''
      - run: npm ci

      # ===== TYPECHECK (DÍVIDA TÉCNICA — @ts-nocheck em progresso) =====
      - name: TypeCheck - site-publico
        run: cd apps/site-publico && npx tsc -p tsconfig.json --noEmit
        continue-on-error: true  # TODO: corrigir erros restantes de typecheck

      - name: TypeCheck - turismo
        run: cd apps/turismo && npx tsc -p tsconfig.json --noEmit
        continue-on-error: true  # TODO: corrigir erros restantes de typecheck

      # ===== BUILD (site-publico DEVE PASSAR) =====
      - name: Build - site-publico
        run: cd apps/site-publico && npx next build

      # ===== BUILD (turismo — DÍVIDA TÉCNICA) =====
      - name: Build - turismo 
        run: cd apps/turismo && npx next build

      # ===== LINT (DÍVIDA TÉCNICA - 1243 erros) =====
      - name: Lint - site-publico
        run: cd apps/site-publico && npx eslint . --max-warnings=9999 || true
        continue-on-error: true  # TODO: corrigir 966 erros ESLint

      - name: Lint - turismo 
        run: cd apps/turismo && npx eslint . --max-warnings=9999 || true
        continue-on-error: true  # TODO: corrigir 277 erros ESLint

      # ===== TESTES (DÍVIDA TÉCNICA - config Jest/DB) =====
      - name: Tests - site-publico
        run: cd apps/site-publico && npm test --if-present || true
        continue-on-error: true  # TODO: corriguraó÷ Jest

      - name: Tests - backend
        run: cd backend && npm run test:ci
        continue-on-error: true  # TEMPORÁRIO: corrigir testes existentes
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/rsv360_test
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test
