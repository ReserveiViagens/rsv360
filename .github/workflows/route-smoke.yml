name: route-smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - 'tests/e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/route-smoke.yml'
  workflow_dispatch:

jobs:
  route-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_USER: rsv360
      POSTGRES_PASSWORD: REDACTED_PG_DEV_PASSWORD
      POSTGRES_DB: rsv_360_ecosystem
      JWT_SECRET: ci_route_smoke_jwt_secret_minimum_32_chars
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Start database services
        run: docker compose up -d postgres redis

      - name: Wait for database
        run: |
          until docker compose exec -T postgres pg_isready -U rsv360 -d rsv_360_ecosystem; do
            sleep 5
          done

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://rsv360:REDACTED_PG_DEV_PASSWORD@localhost:5432/rsv_360_ecosystem
        run: npm run migrate

      - name: Seed deterministic test user
        working-directory: backend
        env:
          DATABASE_URL: postgresql://rsv360:REDACTED_PG_DEV_PASSWORD@localhost:5432/rsv_360_ecosystem
          SEED_TEST_USER_EMAIL: ${{ vars.SEED_TEST_USER_EMAIL }}
          SEED_TEST_USER_PASSWORD: ${{ secrets.SEED_TEST_USER_PASSWORD }}
          SEED_TEST_USER_ROLE: admin
        run: npm run seed

      - name: Run portal booking read smoke
        working-directory: backend
        env:
          DATABASE_URL: postgresql://rsv360:REDACTED_PG_DEV_PASSWORD@localhost:5432/rsv_360_ecosystem
          PORTAL_SMOKE_BOOKING_CODE: SEED-ACC-001
        run: npm run smoke:portal-booking

      - name: Run portal booking write smoke
        working-directory: backend
        env:
          DATABASE_URL: postgresql://rsv360:REDACTED_PG_DEV_PASSWORD@localhost:5432/rsv_360_ecosystem
          PORTAL_SMOKE_BOOKING_CODE: SEED-ACC-001
        run: npx tsx ../server/modules/guest-portal/portal-booking-write.smoke.ts

      - name: Build & start Docker stack
        run: docker compose up -d --build

      - name: Wait for services (URL readiness)
        run: |
          urls=(
            "http://localhost:3002/health"
            "http://localhost:3000/"
            "http://localhost:3004/"
            "http://localhost:3005/"
            "http://localhost:3006/"
          )
          deadline=$((SECONDS + 300))
          for url in "${urls[@]}"; do
            echo "Waiting for $url ..."
            while ! curl -fsS --max-time 5 "$url" > /dev/null; do
              if [ $SECONDS -gt $deadline ]; then
                echo "Timeout waiting for $url" >&2
                docker compose ps
                exit 1
              fi
              sleep 5
            done
            echo "OK: $url"
          done

      - name: Run guest E2E smoke (Phase 7-G.2)
        working-directory: apps/guest
        env:
          DATABASE_URL: postgresql://rsv360:REDACTED_PG_DEV_PASSWORD@localhost:5432/rsv_360_ecosystem
          GUEST_BASE_URL: http://localhost:3006
          PORTAL_TEST_BOOKING_CODE: SEED-ACC-001
          PORTAL_TEST_PATH: /reservations
        run: npx playwright test --reporter=list

      - name: Run route smoke
        env:
          RSV_SMOKE_SITE_PUBLICO_URL: http://localhost:3000
          RSV_SMOKE_ADMIN_URL: http://localhost:3004
          RSV_SMOKE_TURISMO_URL: http://localhost:3005
          RSV_SMOKE_GUEST_URL: http://localhost:3006
        run: npm run test:e2e:routes

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-smoke-artifacts
          path: tests/e2e/artifacts/**
          if-no-files-found: warn
          retention-days: 14

      - name: Dump compose ps on failure
        if: failure()
        run: docker compose ps > compose-ps.txt || true

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-failure-logs
          path: |
            compose-ps.txt
            compose-logs.txt
          if-no-files-found: ignore
