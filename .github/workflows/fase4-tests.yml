name: Fase 4 - Tests and Hardening

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'CODEOWNERS'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/dependabot.yml'
  push:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rsv360_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare npm@10.9.7 --activate

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests (coverage)
        run: npm run test:ci --workspace=backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rsv360_test
          NODE_ENV: test
          MP_ACCESS_TOKEN: test-token
