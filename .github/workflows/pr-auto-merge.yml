name: PR Auto Merge

# Substitui "Allow auto-merge" nativo (indisponível em repo privado no GitHub Free).
# Opt-in: adicione a label "auto-merge" na PR (ou "auto-merge-dependabot" em PRs do Dependabot).

on:
  pull_request:
    types: [labeled, synchronize, opened, ready_for_review]
    branches: [main]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: [CI, route-smoke, "Security Scan"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número da PR para tentar merge"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  try-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'check_suite' ||
      github.event.check_suite.conclusion == 'success' ||
      github.event.check_suite.conclusion == 'skipped'
    steps:
      - uses: actions/checkout@v7

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR=""
          REPO="${{ github.repository }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR="${{ github.event.pull_request.number }}"
            if [ "${{ github.event.action }}" = "labeled" ]; then
              LABEL="${{ github.event.label.name }}"
              if [ "$LABEL" != "auto-merge" ] && [ "$LABEL" != "auto-merge-dependabot" ]; then
                echo "Label not relevant, skip"
                exit 0
              fi
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="${{ github.event.inputs.pr_number }}"
          elif [ "${{ github.event_name }}" = "check_suite" ]; then
            BRANCH="${{ github.event.check_suite.head_branch }}"
            PR="$(gh pr list --repo "$REPO" --state open --base main --head "$BRANCH" --json number -q '.[0].number' 2>/dev/null || true)"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            PR="$(gh pr list --repo "$REPO" --state open --base main --head "$BRANCH" --json number -q '.[0].number' 2>/dev/null || true)"
          fi

          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No open PR resolved"
            echo "number=" >> "$GITHUB_OUTPUT"
          else
            echo "Resolved PR #$PR"
            echo "number=$PR" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt merge
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/pr-auto-merge.sh "${{ steps.pr.outputs.number }}"
