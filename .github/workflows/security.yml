name: "CodeQL"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'CODEOWNERS'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/dependabot.yml'
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      # Keep per-language check names stable while analyzing both JS and TS.
      matrix:
        language: [ 'javascript', 'typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        lfs: true

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql-config.yml

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare npm@10.9.7 --activate

    - name: Install dependencies
      run: npm ci

    - name: Build Next app (apps/site-publico)
      run: npm run build --workspace=apps/site-publico

    - name: TypeScript typecheck (backend)
      run: npx tsc --noEmit --project backend/tsconfig.json

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
