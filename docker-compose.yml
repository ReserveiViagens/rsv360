x-app-env: &app-env
  NEXT_PUBLIC_API_URL: http://localhost:3002
  NEXT_PUBLIC_BACKEND_URL: http://localhost:3002
  INTERNAL_API_URL: http://backend:3002

# Rede unificada (#250) — todos os servicos na mesma rede (sem network connect manual)
networks:
  rsv360_net:
    name: rsv360_internal
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-postgres
    networks:
      - rsv360_net
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - rsv360_pgdata:/var/lib/postgresql/data
      - ./database/g4-auth-smoke-tables.sql:/docker-entrypoint-initdb.d/99-g4-auth-smoke-tables.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rsv360 -d rsv_360_ecosystem']
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-redis
    networks:
      - rsv360_net
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - rsv360_redisdata:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-backend
    networks:
      - rsv360_net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3002:3002'
    environment:
      PORT: 3002
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_DISABLED: 'true'
      JWT_SECRET: ${JWT_SECRET}
      MP_ACCESS_TOKEN: test-token
      META_PIXEL_ID: G-XXXXXXXXXX
      META_CAPI_ACCESS_TOKEN: placeholder
      TIKTOK_PIXEL_ID: G-XXXXXXXXXX
      TIKTOK_ACCESS_TOKEN: placeholder
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:-http://localhost:3000}
      PASSWORD_RESET_EMAIL_WEBHOOK: ${PASSWORD_RESET_EMAIL_WEBHOOK:-}
      PASSWORD_RESET_EMAIL_WEBHOOK_SECRET: ${PASSWORD_RESET_EMAIL_WEBHOOK_SECRET:-}
      PASSWORD_RESET_EMAIL_FROM: ${PASSWORD_RESET_EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      OAUTH_BFF_SECRET: ${OAUTH_BFF_SECRET:-rsv360-docker-dev-oauth-bff}
      SSO_BFF_SECRET: ${SSO_BFF_SECRET:-${OAUTH_BFF_SECRET:-rsv360-docker-dev-oauth-bff}}
      MARKETING_LAB_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3002/health || exit 1']
      interval: 20s
      timeout: 8s
      retries: 5

  admin:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP_DIR: apps/admin
        APP_PORT: 3004
        <<: *app-env
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-admin
    networks:
      - rsv360_net
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3004:3004'
    environment:
      <<: *app-env
      PORT: 3004

  guest:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP_DIR: apps/guest
        APP_PORT: 3006
        <<: *app-env
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-guest
    networks:
      - rsv360_net
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3006:3006'
    environment:
      <<: *app-env
      PORT: 3006

  site-publico:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP_DIR: apps/site-publico
        APP_PORT: 3000
        <<: *app-env
        NEXT_PUBLIC_APP_MODE: ${NEXT_PUBLIC_APP_MODE:-marketing-lab}
        NEXT_PUBLIC_PRIMARY_SITE_URL: ${NEXT_PUBLIC_PRIMARY_SITE_URL:-http://localhost:5000}
        NEXT_PUBLIC_LAB_TITLE: ${NEXT_PUBLIC_LAB_TITLE:-RSV360 Marketing Lab}
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-site-publico
    networks:
      - rsv360_net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      <<: *app-env
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_ENABLED: 'true'
      BACKEND_INTERNAL_URL: http://backend:3002
      OAUTH_BFF_SECRET: ${OAUTH_BFF_SECRET:-rsv360-docker-dev-oauth-bff}
      SSO_BFF_SECRET: ${SSO_BFF_SECRET:-${OAUTH_BFF_SECRET:-rsv360-docker-dev-oauth-bff}}
      SSO_DEV_MOCK: ${SSO_DEV_MOCK:-true}
      MARKETING_LAB_REQUIRE_AUTH: ${MARKETING_LAB_REQUIRE_AUTH:-false}
      OAUTH_DEV_MOCK: ${OAUTH_DEV_MOCK:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      RSV360_APP_MODE: ${RSV360_APP_MODE:-marketing-lab}
      NEXT_PUBLIC_APP_MODE: ${NEXT_PUBLIC_APP_MODE:-marketing-lab}
      NEXT_PUBLIC_PRIMARY_SITE_URL: ${NEXT_PUBLIC_PRIMARY_SITE_URL:-http://localhost:5000}
      NEXT_PUBLIC_LAB_TITLE: ${NEXT_PUBLIC_LAB_TITLE:-RSV360 Marketing Lab}

  turismo:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP_DIR: apps/turismo
        APP_PORT: 3005
        <<: *app-env
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-turismo
    networks:
      - rsv360_net
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3005:3005'
    environment:
      <<: *app-env
      PORT: 3005
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 -O /dev/null http://127.0.0.1:3005/api/health || exit 1']
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 90s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-prometheus
    networks:
      - rsv360_net
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-alertmanager
    networks:
      - rsv360_net
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - '9093:9093'
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  grafana:
    image: grafana/grafana-oss:11.1.5
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-grafana
    networks:
      - rsv360_net
    restart: unless-stopped
    ports:
      - '3007:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  rsv360_pgdata:
    driver: local
  rsv360_redisdata:
    driver: local
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local
  grafana_data:
    driver: local
